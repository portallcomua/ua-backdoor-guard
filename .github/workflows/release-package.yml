name: Validate and publish UA Backdoor Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP syntax check
        run: php -l ua-backdoor-guard.php

  package-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WordPress plugin ZIP with correct root folder
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -E 'Version: [0-9]+\\.[0-9]+\\.[0-9]+' ua-backdoor-guard.php | sed -E 's/.*Version: //')"
          TAG="v$VERSION"
          mkdir -p dist/ua-backdoor-guard
          cp ua-backdoor-guard.php README.md dist/ua-backdoor-guard/
          cd dist
          zip -r ua-backdoor-guard.zip ua-backdoor-guard
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ua-backdoor-guard.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ua-backdoor-guard.zip --repo "$GITHUB_REPOSITORY" --title "UA Backdoor Guard $VERSION" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
